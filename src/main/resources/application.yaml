spring:
  application:
    name: demo1
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: demo
    default-schema: demo
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: demo
        tenant_identifier_resolver: com.example.demo.security.TenantIdentifierResolver
    open-in-view: false

reports:
  storage-dir: ${REPORT_STORAGE_DIR:./storage/reports}
  worker:
    poll-interval-ms: ${REPORT_WORKER_POLL_INTERVAL_MS:3000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework
