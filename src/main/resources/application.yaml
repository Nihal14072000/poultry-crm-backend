spring:
  application:
    name: demo1
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: demo
    open-in-view: false

reports:
  storage-dir: ${REPORT_STORAGE_DIR:./storage/reports}
  worker:
    poll-interval-ms: ${REPORT_WORKER_POLL_INTERVAL_MS:3000}
