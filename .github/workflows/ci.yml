name: Backend CI

on:
  pull_request:
  push:
    branches:
      - v5
      - cicd-deployment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poultry_crm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poultry_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run SaaS tenant-isolation regression tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B -Dtest=TenantIdentifierResolverTest,BusinessRecordServiceTest,Demo1ApplicationTests,PartyOrderRelationRepositoryIntegrationTest,FlywayMigrationSmokeTest clean verify
