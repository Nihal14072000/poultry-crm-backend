name: Backend CI

on:
  pull_request:
  push:
    branches:
      - v5
      - cicd-deployment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run SaaS tenant-isolation regression tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B -Dtest=TenantIdentifierResolverTest,BusinessRecordServiceTest,Demo1ApplicationTests,PartyOrderRelationRepositoryIntegrationTest clean verify
