name: Deploy Spring Boot CRM

on:
  pull_request:
    branches:
      - cicd-deployment
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Deploy only after a PR has actually been merged into cicd-deployment.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || (github.event_name == 'workflow_dispatch' && 'cicd-deployment') || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify

      - name: Locate executable Spring Boot JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)
          test -n "$JAR" || { echo "No executable JAR found in target/"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing SSH_KNOWN_HOSTS secret"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy JAR to Oracle VM
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST repository variable"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER repository variable"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH repository variable"; exit 1; }
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key "$JAR_PATH" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app.jar.new"

      - name: Restart backend and verify health
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Keep the last deployed JAR available for rollback.
          if [ -f app.jar ]; then cp app.jar app.jar.previous; fi
          mv app.jar.new app.jar

          # Stop only the process listening on the configured application port.
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 5678/tcp || true
          else
            echo "fuser is required on the VM to stop the existing listener safely."
            exit 1
          fi
          sleep 2

          # Load the existing server-side environment file when present.
          # Store DB_URL, DB_USERNAME, DB_PASSWORD and other runtime settings there.
          if [ -f .env ]; then
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
          fi

          nohup java -jar "$DEPLOY_PATH/app.jar" \
            --spring.config.additional-location=file:/home/ubuntu/poultry-crm-backend/target/application.yaml \
            --server.address=0.0.0.0 \
            --server.port=5678 \
            > "$DEPLOY_PATH/app.log" 2>&1 < /dev/null &

          echo $! > "$DEPLOY_PATH/app.pid"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5678/ >/dev/null; then
              echo "Backend is responding on port 5678."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Recent application logs:"
          tail -n 100 "$DEPLOY_PATH/app.log" || true
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
